<h1>حاسبة أسعار الذهب والفضة</h1>

<div class="info">
45 شارع الحجاز - مصر الجديدة - الميريلاند - عمارة ويسترن يونيون وبجوار التوحيد والنور فرع الميريلاند<br>
👈 <a href="https://maps.app.goo.gl/hUrqCU6eUYBk28369" target="_blank">اللوكيشن</a><br>
مواعيد العمل: بتحديد موعد مسبق من على موقعنا<br>
<a href="https://linktr.ee/topaz_jew" target="_blank">Linktr.ee/topaz_jew</a>
</div>


<div class="box">
<h2>حاسبة الذهب</h2>
<div class="note">عيار 21 = 875 سهم</div>
<label>أدخل سعر الذهب بيع أو شراء المطلوب الحساب على أساسه</label>
<input id="goldPrice" type="number" step="0.01">
<label>أدخل العيار أو السهم المطلوب</label>
<input id="goldPurity" type="number" step="0.1" placeholder="مثال: 21 أو 875">
<div id="goldResult" class="result">—</div>
</div>

<div class="box">
<h2>حاسبة الفضة</h2>
<div class="note">عيار 1000 = 1000 سهم</div>
<label>أدخل سعر الفضة بيع أو شراء المطلوب الحساب على أساسه</label>
<input id="silverPrice" type="number" step="0.01">
<label>أدخل العيار أو السهم المطلوب</label>
<input id="silverPurity" type="number" step="0.1" placeholder="مثال: 925 أو 999">
<div id="silverResult" class="result">—</div>
</div>

</div>
<script>
function goldShares(v){
  return v <= 24 ? (v / 24) * 1000 : v;
}
function calc(){
  const goldPrice = parseFloat(document.getElementById('goldPrice').value);
  const goldInput = parseFloat(document.getElementById('goldPurity').value);
  const silverPrice = parseFloat(document.getElementById('silverPrice').value);
  const silverInput = parseFloat(document.getElementById('silverPurity').value);

  const goldResult = document.getElementById('goldResult');
  const silverResult = document.getElementById('silverResult');

  if(goldPrice > 0 && goldInput > 0){
    const shares = goldShares(goldInput);
    goldResult.textContent = (goldPrice * shares / 875).toFixed(2);
  } else {
    goldResult.textContent = '—';
  }

  if(silverPrice > 0 && silverInput > 0){
    const shares = silverInput <= 1000 ? silverInput : 0;
    silverResult.textContent = shares > 0 ? (silverPrice * shares / 1000).toFixed(2) : '—';
  } else {
    silverResult.textContent = '—';
  }
}
document.querySelectorAll('input').forEach(function(x){
  x.addEventListener('input', calc);
});
</script>
